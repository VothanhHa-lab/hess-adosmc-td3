# HESS DO-SMC — reduced-storage plant (60 kW traction rating, 24 kW battery converter limit, 120 F SC).
# Used only for the storage-sizing sensitivity study (results in archive_reduced_storage/).
# The main study uses configs/nominal.yaml (Tesla Model 3).
# Every value carries a unit and a source tag:
#   ASSUMED   : design choice of this work, documented in README
#   DESIGN    : derived by this code from other values (see src/hess/design.py)

plant:                     # "true" plant (Monte Carlo perturbs these)
  Cdc:      {value: 2.2e-3, unit: F,   source: ASSUMED}
  Lb:       {value: 1.5e-3, unit: H,   source: ASSUMED}
  Lsc:      {value: 1.0e-3, unit: H,   source: ASSUMED}
  rb:       {value: 0.03,   unit: Ohm, source: ASSUMED}   # inductor + switch resistance, battery leg
  rsc:      {value: 0.02,   unit: Ohm, source: ASSUMED}   # inductor + switch resistance, SC leg
  R0b:      {value: 0.08,   unit: Ohm, source: ASSUMED}   # battery pack internal resistance
  ocv_nom:  {value: 300.0,  unit: V,   source: ASSUMED}  # OCV at soc_ref
  ocv_slope: {value: 25.0,   unit: V/1, source: ASSUMED}   # dOCV/dSOC (linear OCV)
  soc_ref:  {value: 0.7,    unit: "1", source: ASSUMED}
  soc0:     {value: 0.7,    unit: "1", source: ASSUMED}
  Qb:       {value: 40.0,   unit: Ah,  source: ASSUMED}
  eta_b:    {value: 1.0,    unit: "1", source: ASSUMED}   # coulombic efficiency in Eq.(7)
  Csc:      {value: 120.0,  unit: F,   source: ASSUMED}
  Resr:     {value: 0.01,   unit: Ohm, source: ASSUMED}   # SC ESR
  vsc0:     {value: 250.0,  unit: V,   source: ASSUMED}   # inside the 150-300 V SC window

limits:
  Ibmax:    {value: 80.0,   unit: A,   source: ASSUMED}  # applied to battery inductor current, Eq.(5)
  Iscmax:   {value: 180.0,  unit: A,   source: ASSUMED}  # applied to SC inductor current, Eq.(5)
  vscmin:   {value: 150.0,  unit: V,   source: ASSUMED}
  vscmax:   {value: 300.0,  unit: V,   source: ASSUMED}
  dmax:     {value: 0.95,   unit: "1", source: ASSUMED}   # duty upper bound, Eq.(6)

control:
  vref:     {value: 400.0,  unit: V,   source: ASSUMED}
  lam:      {value: 250.0,  unit: 1/s, source: ASSUMED}  # NDO gain lambda
  ks:       {value: 120.0,  unit: V/s, source: ASSUMED}  # switching gain (units of de/dt)
  phi:      {value: 0.5,    unit: V,   source: ASSUMED}  # boundary layer on s
  cv:       {value: 100.0,  unit: 1/s, source: ASSUMED}   # integral sliding-surface gain, not given in paper
  taub:     {value: 0.2,    unit: s,   source: ASSUMED}   # battery LPF time constant, Eq.(24), not given
  wci:      {value: 5026.5, unit: rad/s, source: ASSUMED} # inner current-loop bandwidth (2*pi*800 Hz)
  ki_ratio: {value: 5.0,    unit: "1", source: ASSUMED}   # Ki_i = Kp_i*wci/ki_ratio
  alloc_mode: {value: 1,    unit: "-", source: ASSUMED}   # 1 = redistribute SC shortfall to battery, 0 = paper-literal Eqs.(24)-(27)
  # PI baseline: gains DESIGNED to share the small-signal closed-loop poles {-cv, -ks/phi} of DO-SMC
  # MPC baseline: offset-free, constraint-tightened (Chisci et al. 2001 type), LQR terminal cost
  mpc_N:    {value: 20,     unit: "-", source: ASSUMED}
  mpc_wmax: {value: 2000.0, unit: V/s, source: ASSUMED}   # assumed bound on disturbance-estimate error for tightening

timing:
  Ts:       {value: 5.0e-5, unit: s,   source: ASSUMED}   # controller sampling = PWM period (20 kHz)
  n_sub_avg: {value: 10,     unit: "-", source: ASSUMED}   # RK4 substeps per Ts (averaged plant) -> 5 us
  n_sub_sw: {value: 200,    unit: "-", source: ASSUMED}   # substeps per Ts (switched plant) -> 0.25 us
  delay:    {value: 1,      unit: "-", source: ASSUMED}   # one-sample computation delay
  log_every_transient: {value: 1,  unit: samples, source: ASSUMED}
  log_every_urban:     {value: 4,  unit: samples, source: ASSUMED}

noise:                       # measurement noise (Monte Carlo and nominal)
  sig_v:    {value: 0.2,    unit: V,   source: ASSUMED}
  sig_i:    {value: 0.2,    unit: A,   source: ASSUMED}

montecarlo:
  n_runs: 30
  base_seed: 20261106
  # relative 1-sigma uniform half-widths applied to the TRUE plant; controllers keep nominal values
  rel_uniform:
    Cdc: 0.20
    Lb: 0.10
    Lsc: 0.10
    rb: 0.50
    rsc: 0.50
    R0b: 0.30
    Resr: 0.30
    load_scale: 0.10        # scales the whole load profile

sweep:
  lam: [50, 100, 250, 500, 1000]

# ---------------------------------------------------------------- two-tier study
supervision:                 # defaults (= fixed supervisor); the agent changes taub, vsc_ref, lam
  vsc_ref:  {value: 250.0,  unit: V,   source: ASSUMED}   # SC voltage target for energy recovery
  kE:       {value: 0.02,   unit: 1/s, source: ASSUMED}   # P_rec = kE * 0.5*Csc*(vsc_ref^2 - vsc^2)
  Prec_max: {value: 5000.0, unit: W,   source: ASSUMED}   # recovery power cap
  k_min:    {value: 120.0,  unit: V/s, source: ASSUMED}  # floor = paper ks
  beta:     {value: 1.5,    unit: "1", source: ASSUMED}   # margin over estimated |D~| (Eq. 38)
  tau_f:    {value: 0.002,  unit: s,   source: ASSUMED}   # filter on dD_hat/dt
  tau_env:  {value: 0.05,   unit: s,   source: ASSUMED}   # envelope decay of |D~| estimate

vehicle:                     # speed -> traction power (all ASSUMED, mid-size BEV)
  mass:     {value: 1600.0, unit: kg}
  rot_frac: {value: 0.05,   unit: "1"}    # rotating-inertia equivalent mass fraction
  Cd:       {value: 0.28,   unit: "1"}
  Af:       {value: 2.3,    unit: m2}
  Crr:      {value: 0.009,  unit: "1"}
  rho_air:  {value: 1.2,    unit: kg/m3}
  eta_trac: {value: 0.90,   unit: "1"}    # motor+inverter, motoring
  eta_regen: {value: 0.80,   unit: "1"}    # motor+inverter, generating
  regen_frac: {value: 0.70, unit: "1"}    # share of braking power recovered electrically
  P_aux:    {value: 1000.0, unit: W}
  P_trac_max: {value: 60000.0, unit: W}   # motor rating (consistent with Fig. 2 scale)
  P_regen_max: {value: 30000.0, unit: W}

agent:
  dt_agent: 0.1              # s, supervisory decision period
  tau_range: [0.05, 5.0]     # s  (filtered, log-scale)
  vsc_range: [200.0, 290.0]  # V
  lam_range: [100.0, 800.0]  # 1/s
  rate_log_tau: 0.2          # max |d log(tau)| per decision (safety filter)
  rate_vsc: 5.0              # V per decision
  rate_lam: 50.0             # 1/s per decision
  unfiltered_tau_range: [0.01, 20.0]
  unfiltered_vsc_range: [160.0, 299.0]
  unfiltered_lam_range: [20.0, 2000.0]
  reserve_s: 2.0             # v1 filter: energy-reserve horizon for vsc_ref lower bound (found non-binding on test, kept as ablation)
  # v2 filter: power-capability reserve. vsc_ref >= sqrt(v_pow^2 + 2*E_res/Csc), v_pow = (P_trac_max - vb*Ib_max)/Isc_max.
  # E_res = largest contiguous energy deficit (P_L > vb*Ib_max) found in the TRAIN cycles (scripts/reserve_stat.py).
  reserve_energy_J: 234751.0   # output of scripts/reserve_stat.py
  extra_test_set: [[wmtc_all, 1.0, 0.0, 0.0], [ftpmc1b, 1.0, 0.0, 0.0], [longHaulDriveCycle, 1.0, 0.0, 1200.0]]  # cycle, scale, t_start, duration (0 = full); never used before filter v2
  reward: {w_v: 0.5, w_rms: 1.0, w_slew: 0.5, w_sat: 5.0, w_soc: 2.0, e_ref: 5.0, slew_ref: 500.0, clip: 10.0}
  td3: {hidden: 64, gamma: 0.98, tau: 0.005, lr_actor: 0.0003, lr_critic: 0.0003, batch: 128,
        buffer: 200000, warmup: 2000, expl_noise: 0.2, policy_noise: 0.2, noise_clip: 0.5,
        policy_delay: 2, episodes: 240, episode_s: 30.0, eval_every: 40}
  train_seeds: [11, 22, 33]
  train_randomization: {vsc0: [210.0, 285.0], soc0: [0.5, 0.9], load_scale: [0.9, 1.4]}
  validation_set: [[wltc_low_3, 1.0], [wltc_medium_3b, 1.0], [wltc_medium_3b, 1.6]]
  test_set: [[us06, 1.0], [wltc_high_3b, 1.0], [wltc_extrahigh_3, 1.0], [wltc_extrahigh_3, 1.2], [us06, 1.1]]
  rule_tau_range: [0.2, 5.0]
  # MPC-EMS baseline (non-learning tier 2). horizon_s chosen on the VALIDATION set from {2, 5, 10} s
  # (scripts/mpc_ems_select.py); never tuned on test items.
  mpc_ems: {horizon_s: {persistence: 2.0, preview: 2.0}, n_grid: 5}   # selected (data/processed/mpc_ems_selection.json)

cycles:
  train: [udds, hwfet, NREL13, TSDC_tripno_42648_cycle]
  validation: [wltc_low_3, wltc_medium_3b]
  test: [us06, wltc_high_3b, wltc_extrahigh_3]
  source: "NREL FASTSim repository, branch fastsim-2, commit pinned in data/cycles/SOURCE_COMMIT.txt"
